<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c33"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d6bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4d6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sp" width="38" height="14" patternUnits="userSpaceOnUse">
      <rect x="13" y="3" width="12" height="8" rx="2.5" fill="#31406b"/>
    </pattern>
  </defs>

  <!-- 影厅背景 -->
  <rect width="800" height="470" rx="16" fill="url(#bg)"/>
  <ellipse cx="400" cy="64" rx="330" ry="95" fill="url(#glow)"/>

  <!-- 星点 -->
  <circle cx="120" cy="150" r="1.2" fill="#41538a" opacity="0.8"/>
  <circle cx="680" cy="170" r="1.5" fill="#41538a" opacity="0.6"/>
  <circle cx="90"  cy="300" r="1"   fill="#33406b" opacity="0.9"/>
  <circle cx="710" cy="320" r="1.2" fill="#33406b" opacity="0.7"/>
  <circle cx="200" cy="88"  r="1"   fill="#3a4a7a" opacity="0.7"/>
  <circle cx="620" cy="96"  r="1.3" fill="#3a4a7a" opacity="0.8"/>

  <!-- 胶片边框 -->
  <rect x="44" y="16"  width="712" height="14" rx="7" fill="#0d1426"/>
  <rect x="44" y="16"  width="712" height="14" rx="7" fill="url(#sp)"/>
  <rect x="44" y="440" width="712" height="14" rx="7" fill="#0d1426"/>
  <rect x="44" y="440" width="712" height="14" rx="7" fill="url(#sp)"/>

  <!-- 标题 -->
  <text x="400" y="92"  text-anchor="middle" font-size="13" font-weight="600" letter-spacing="7" fill="#7f96e8">NOW SHOWING</text>
  <text x="400" y="134" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="4" fill="#eef2fb">影院留言墙</text>

  <!-- 置顶标签 -->
  <rect x="344" y="160" width="112" height="26" rx="13" fill="#182441" stroke="#35446f" stroke-width="1"/>
  <text x="400" y="178" text-anchor="middle" font-size="13" fill="#8ea2ff">置顶留言</text>

  <!-- 留言正文 -->
  <text x="400" y="224" text-anchor="middle" font-size="16.5" fill="#c6d2e8">人死的瞬间就会进入电影院，</text>
  <text x="400" y="254" text-anchor="middle" font-size="16.5" fill="#c6d2e8">手里拿着<tspan fill="#ffd166">爆米花</tspan>和<tspan fill="#ff9f68">可乐</tspan>，然后找自己的座位。</text>
  <text x="400" y="284" text-anchor="middle" font-size="16.5" fill="#c6d2e8">坐到位子上之后就变暗了，</text>
  <text x="400" y="314" text-anchor="middle" font-size="16.5" fill="#c6d2e8">然后开始播放很多电影的预告，</text>
  <text x="400" y="344" text-anchor="middle" font-size="16.5" fill="#c6d2e8">会有好多好多有意思的电影，</text>
  <text x="400" y="386" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="1" fill="#ffb84d">永远，永远地……</text>

  <!-- 票根 -->
  <line x1="210" y1="408" x2="590" y2="408" stroke="#2b3860" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="400" y="432" text-anchor="middle" font-size="12" letter-spacing="5" fill="#66759a">ADMIT ONE · 永远有效</text>
</svg>
