<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <!-- 卡片 -->
  <rect x="0.5" y="0.5" width="799" height="239" rx="14" fill="#fbfcfd" stroke="#e5e8ec"/>

  <!-- 留言 -->
  <text x="86" y="66" font-size="16.5" fill="#4b5563">人死的瞬间就会进入电影院，手里拿着爆米花和可乐，</text>
  <text x="86" y="100" font-size="16.5" fill="#4b5563">然后找自己的座位。坐到位子上之后就变暗了，</text>
  <text x="86" y="134" font-size="16.5" fill="#4b5563">然后开始播放很多电影的预告，会有好多好多有意思的电影，</text>
  <text x="86" y="176" font-size="18" font-weight="600" fill="#24292f">永远，永远地……</text>

  <!-- 署名 -->
  <text x="730" y="212" text-anchor="end" font-size="13" fill="#a0a6b0">—— 藤本タツキ</text>
</svg>
